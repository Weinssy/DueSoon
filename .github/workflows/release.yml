name: Build & Publish Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests & AndroidTest compilation
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin --console=plain

      - name: Configure release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Secret KEYSTORE_BASE64 is required for signed release builds compatible with In-App Update."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          cat <<EOF > keystore.properties
          KEYSTORE_PATH=release.keystore
          KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          KEY_ALIAS=$KEY_ALIAS
          KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain

      - name: Locate release APK and notes
        id: release_meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          NOTES_FILE="docs/releases/$TAG/release-notes-$TAG.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.release_meta.outputs.apk_path }}
          body_path: ${{ steps.release_meta.outputs.notes_file }}
          generate_release_notes: ${{ steps.release_meta.outputs.notes_file == '' }}
          draft: false
          prerelease: false
